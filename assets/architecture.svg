<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">RiskLab experiment architecture</title>
  <desc id="desc">A deterministic simulation flows through trailing windows, estimators, allocation methods, execution costs, and evidence outputs.</desc>
  <rect width="1280" height="520" fill="#f6f7f5"/>
  <style>
    .box{fill:#fff;stroke:#263a42;stroke-width:2}.accent{fill:#e5f0ec;stroke:#315d52;stroke-width:2}.warn{fill:#f6ead8;stroke:#805f32;stroke-width:2}
    .h{font:700 20px system-ui,sans-serif;fill:#16262d}.t{font:15px system-ui,sans-serif;fill:#354950}.m{font:13px ui-monospace,monospace;fill:#354950}
    .a{stroke:#46636d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#46636d"/></marker></defs>
  <text x="55" y="54" class="h">STRICT WALK-FORWARD EXPERIMENT GRAPH</text>
  <rect x="55" y="98" width="190" height="110" rx="12" class="accent"/>
  <text x="75" y="132" class="h">Simulator</text><text x="75" y="160" class="t">4 heavy-tailed regimes</text><text x="75" y="184" class="m">seed + SHA-256</text>
  <rect x="305" y="98" width="205" height="110" rx="12" class="box"/>
  <text x="325" y="132" class="h">Temporal gate</text><text x="325" y="160" class="m">[t-window, t)</text><text x="325" y="184" class="t">future inaccessible</text>
  <rect x="570" y="78" width="255" height="150" rx="12" class="box"/>
  <text x="590" y="112" class="h">Estimation + allocation</text><text x="590" y="141" class="t">empirical / OAS covariance</text><text x="590" y="165" class="t">EW / IV / MV / RP / CVaR</text><text x="590" y="191" class="m">long-only + cap</text>
  <rect x="885" y="98" width="200" height="110" rx="12" class="warn"/>
  <text x="905" y="132" class="h">Execution</text><text x="905" y="160" class="t">weight drift + turnover</text><text x="905" y="184" class="t">explicit bps cost</text>
  <rect x="865" y="320" width="260" height="120" rx="12" class="accent"/>
  <text x="885" y="354" class="h">Evidence bundle</text><text x="885" y="382" class="t">JSON / CSV / report / figures</text><text x="885" y="408" class="t">failure counts + provenance</text>
  <rect x="525" y="320" width="270" height="120" rx="12" class="box"/>
  <text x="545" y="354" class="h">Uncertainty</text><text x="545" y="382" class="t">paired circular block bootstrap</text><text x="545" y="408" class="m">candidate − equal weight</text>
  <rect x="185" y="320" width="270" height="120" rx="12" class="box"/>
  <text x="205" y="354" class="h">Adversarial checks</text><text x="205" y="382" class="t">future mutation / PSD / costs</text><text x="205" y="408" class="t">determinism / reduced E2E</text>
  <path d="M245 153H295" class="a"/><path d="M510 153H560" class="a"/><path d="M825 153H875" class="a"/>
  <path d="M985 208V300" class="a"/><path d="M865 380H805" class="a"/><path d="M525 380H465" class="a"/>
</svg>
