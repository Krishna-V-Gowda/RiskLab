[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "risklab-research"
version = "0.1.0"
description = "A reproducible walk-forward laboratory for allocation robustness under estimation error, regime shifts, turnover, and costs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna V. Gowda" }]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
]

[project.scripts]
risklab = "risklab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
